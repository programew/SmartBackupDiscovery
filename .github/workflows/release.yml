name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from SmartBackupDiscovery.csproj (for example 3.4.0)
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '3.3.0' }}
        shell: bash
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          project_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' SmartBackupDiscovery.csproj | head -n 1)"
          if [[ "$project_version" != "$version" ]]; then
            echo "Requested version $version does not match project version $project_version." >&2
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi

          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 == "## " version { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "No CHANGELOG.md section found for $version." >&2
            exit 1
          fi

          {
            echo "SmartBackupDiscovery $version"
            echo
            cat "$notes_file"
            echo
            echo "## Source code"
            echo
            echo "GitHub provides the complete source automatically as ZIP and TAR.GZ archives below."
          } > release-notes.md

          gh release create "$tag"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "SmartBackupDiscovery $version"             --notes-file release-notes.md
